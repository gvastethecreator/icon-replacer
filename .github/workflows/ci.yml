name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-tests:
    name: Managed tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests\IconReplacer.Core.Tests\IconReplacer.Core.Tests.csproj

      - name: Test
        run: dotnet test tests\IconReplacer.Core.Tests\IconReplacer.Core.Tests.csproj --configuration Release --no-restore
